name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: grok-linux-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: grok-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install DotSlash
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)  url="https://github.com/facebook/dotslash/releases/download/v0.5.9/dotslash-linux-musl.x86_64.v0.5.9.tar.gz" ;;
            macOS)  url="https://github.com/facebook/dotslash/releases/download/v0.5.9/dotslash-macos-arm64.v0.5.9.tar.gz" ;;
            *) echo "unsupported runner os: $RUNNER_OS" >&2; exit 1 ;;
          esac
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/dotslash.tar.gz" "$url"
          tar -xzf "$RUNNER_TEMP/dotslash.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/dotslash-bin"
          mv "$RUNNER_TEMP/dotslash" "$RUNNER_TEMP/dotslash-bin/dotslash"
          chmod +x "$RUNNER_TEMP/dotslash-bin/dotslash"
          echo "$RUNNER_TEMP/dotslash-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/dotslash-bin:$PATH"
          dotslash --version

      - name: Build release binary
        run: cargo build -p xai-grok-pager-bin --release --target ${{ matrix.target }}

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/xai-grok-pager dist/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
